# Prometheus config for the MLOps sessions
global:
  scrape_interval: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # The model API you run on your laptop in Session 2 (exposes /metrics on port 8000)
  - job_name: model-api
    static_configs:
      - targets: ["host.docker.internal:8000"]
